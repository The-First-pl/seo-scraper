<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SEO Audyt{% endblock %} — Amann Kaffee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --brand-dark: #1F3864;
      --brand-blue: #2E75B6;
      --brand-light: #EBF3FB;
    }
    body { background: #f4f6fa; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar { background: var(--brand-dark) !important; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .btn-brand { background: var(--brand-blue); color: #fff; border: none; }
    .btn-brand:hover { background: var(--brand-dark); color: #fff; }
    .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,.08); border-radius: 12px; }
    .card-header-brand {
      background: var(--brand-dark); color: #fff;
      border-radius: 12px 12px 0 0 !important; padding: 1rem 1.5rem;
    }
    .badge-blue { background: var(--brand-blue); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
  <a class="navbar-brand" href="/">
    <i class="bi bi-bar-chart-line-fill me-2"></i>SEO Audyt
  </a>
  <div class="d-flex align-items-center gap-3">
    {% if session.get('credentials') %}
      <span class="text-white-50 small"><i class="bi bi-google me-1"></i>Zalogowany</span>
      <a href="/logout" class="btn btn-outline-light btn-sm">Wyloguj</a>
    {% endif %}
  </div>
</nav>

<main class="container py-5" style="max-width:860px">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
